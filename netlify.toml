# Static site: hand-written HTML and CSS, no build step.
# The HTML is generated by tools/gen_corporate.py and committed as-is.
[build]
  publish = "."
  command = ""

# The apex is the canonical host; www sends visitors there.
[[redirects]]
  from = "https://www.affectosphere.group/*"
  to = "https://affectosphere.group/:splat"
  status = 301
  force = true
